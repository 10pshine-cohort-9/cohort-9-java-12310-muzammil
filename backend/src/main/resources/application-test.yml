spring:
  datasource:
    url: jdbc:h2:mem:cms_db;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  mail:
    host: localhost
    port: 25

app:
  jwt:
    secret: a_very_long_test_secret_key_that_is_at_least_32_bytes_for_jjwt
    expiration-ms: 3600000
  cors:
    allowed-origins: "*"
